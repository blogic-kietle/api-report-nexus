version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    gocritic:
      enabled-tags: [diagnostic]
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        # documentation lives in assets/openapi.yaml, not in doc comments
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets: [comments, std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [gosec, prealloc]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [api-report-nexus]
