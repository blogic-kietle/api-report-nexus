x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  api-report-nexus:
    <<: *logging
    # image: ghcr.io/blogicsystems/api-report-nexus:${VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: api-report-nexus
    networks:
      - report-nexus
    depends_on:
      - gotenberg
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      TZ: ${TZ:-Etc/UTC}
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - ./certs:/app/certs:ro # RabbitMQ client .p12 + CA, referenced by RABBITMQ_CERT_PATH / RABBITMQ_CA_PATH
    restart: ${RESTART_POLICY:-unless-stopped}

  gotenberg:
    <<: *logging
    image: gotenberg/gotenberg:8-chromium
    container_name: gotenberg
    command:
      - gotenberg
      - --api-timeout=300s
      - --chromium-deny-private-ips=true
      - --chromium-auto-start=true
      - --chromium-max-queue-size=50
    networks:
      - report-nexus
    shm_size: "2g"
    restart: ${RESTART_POLICY:-unless-stopped}

  victorialogs:
    <<: *logging
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    command: ["-storageDataPath=/victoria-logs-data", "-retentionPeriod=30d"]
    volumes:
      - victoria-logs-data:/victoria-logs-data
    ports:
      - "9428:9428"
    networks:
      - report-nexus
    restart: ${RESTART_POLICY:-unless-stopped}

  vector:
    <<: *logging
    image: timberio/vector:0.58.0-alpine
    container_name: vector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      - victorialogs
    networks:
      - report-nexus
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  victoria-logs-data:

networks:
  report-nexus:
    driver: bridge
