version: v2
# The proto keeps the scheduler's go_package; managed mode rewrites it to this module.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: api-report-nexus/internal/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/gen
    opt: paths=source_relative
inputs:
  - directory: proto
